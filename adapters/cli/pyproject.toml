[project]
name = "amplifier-loop-live-cli"
version = "0.1.0"
description = "Optional Amplifier CLI host adapter for loop-live"
requires-python = ">=3.13"
dependencies = [
  "amplifier-module-loop-live>=0.1.0",
  "amplifier-app-cli>=0.1.1",
  "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@main",
  "amplifier-workspace @ git+https://github.com/microsoft/amplifier-workspace@main",
  "amplifier-module-loop-streaming @ git+https://github.com/microsoft/amplifier-module-loop-streaming@main",
  "amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple@main",
  "amplifier-module-provider-anthropic @ git+https://github.com/microsoft/amplifier-module-provider-anthropic@main",
  "amplifier-module-provider-openai @ git+https://github.com/microsoft/amplifier-module-provider-openai@main",
  "amplifier-module-provider-openai-chatgpt @ git+https://github.com/microsoft/amplifier-module-provider-openai-chatgpt@main",
  "amplifier-module-provider-github-copilot @ git+https://github.com/microsoft/amplifier-module-provider-github-copilot@main",
  "amplifier-module-provider-gemini @ git+https://github.com/microsoft/amplifier-module-provider-gemini@main",
  "websockets==15.0.1",
  "prompt-toolkit==3.0.52",
]

[project.scripts]
amplifier-live-manager = "amplifier_loop_live_cli.manager:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_loop_live_cli"]

[tool.hatch.metadata]
allow-direct-references = true
