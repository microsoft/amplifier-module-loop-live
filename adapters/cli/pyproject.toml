[project]
name = "amplifier-loop-live-cli"
version = "0.1.0"
description = "Optional Amplifier CLI host adapter for loop-live"
requires-python = ">=3.13"
dependencies = [
  "amplifier-module-loop-live>=0.1.0",
  "amplifier-app-cli>=0.1.1",
  "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@e210edabd947af82d5121a240d6934283ac540b9",
  "amplifier-workspace @ git+https://github.com/microsoft/amplifier-workspace@9305bee38961a845f3ac7b2a07726880f9598a91",
  "amplifier-module-loop-streaming @ git+https://github.com/microsoft/amplifier-module-loop-streaming@2feefe4ba0c4cb50fc0c6b33648a8ef6a2908820",
  "amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple@2d1bdc4d9c1803491fe39820c8d503dd764d32de",
  "amplifier-module-provider-anthropic @ git+https://github.com/microsoft/amplifier-module-provider-anthropic@12fffb6ad2bafb1bb7999ab02245a35e42ca8672",
  "amplifier-module-provider-openai @ git+https://github.com/microsoft/amplifier-module-provider-openai@c9b0e8e60702269c7a637875b89d011facfde020",
  "amplifier-module-provider-openai-chatgpt @ git+https://github.com/microsoft/amplifier-module-provider-openai-chatgpt@b522d4fb57b8c5aebd03cb4cf4eacb7d5e64bd19",
  "amplifier-module-provider-github-copilot @ git+https://github.com/microsoft/amplifier-module-provider-github-copilot@d2d27663d8808d7692e588d709c63e58ec418545",
  "amplifier-module-provider-gemini @ git+https://github.com/microsoft/amplifier-module-provider-gemini@1c1bcbaf4d296eae2cabe1ec0f84bcd9fb8aa109",
  "websockets==15.0.1",
  "prompt-toolkit==3.0.52",
]

[project.scripts]
amplifier-live-manager = "amplifier_loop_live_cli.manager:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_loop_live_cli"]

[tool.hatch.metadata]
allow-direct-references = true
