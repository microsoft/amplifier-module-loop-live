bundle:
  name: work-local
  version: 0.2.0
  description: Opt-in Work profile with pinned live execution, boundary context, and transcript retrieval.

# No model/provider override: experiments keep the user's chosen provider.
# Sources are reviewed commits; hosts still own credentials and live transport.
session:
  orchestrator:
    module: loop-live
    source: git+https://github.com/bkrabach/amplifier-module-loop-live@de307c398facea5d4d656e14f84938a74b934ff2
    config:
      background_delegate: false
      background_tools: [delegate]
      max_background_jobs: 4
      inherit_effective_model: true
  context:
    module: context-managed
    source: git+https://github.com/microsoft/amplifier-bundle-context-managed@5b0816edb8761dc0ad38719ae59b4ee40808b36a#subdirectory=modules/context-managed
    config:
      engine: boundary
      token_meter: actual
      summarize_trigger: 0.70
      summary_target_tokens: 1500
      summary_timeout: 120

tools:
  - module: tool-transcript
    source: git+https://github.com/microsoft/amplifier-bundle-context-managed@5b0816edb8761dc0ad38719ae59b4ee40808b36a#subdirectory=modules/tool-transcript
