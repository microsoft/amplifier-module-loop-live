name: Exact reviewed candidate pair (not ordinary CI)

on:
  pull_request:
    paths: ['.github/workflows/exact-candidate.yml', '.github/ci/**']
  push:
    branches: ['test/media-live-exact-candidate-ci']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: candidate-${{ matrix.lane }}-${{ matrix.os }}-py${{ matrix.python }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: component, os: ubuntu-latest, python: '3.11'}
          - {lane: component, os: ubuntu-latest, python: '3.13'}
          - {lane: component, os: macos-latest, python: '3.11'}
          - {lane: component, os: macos-latest, python: '3.13'}
          - {lane: native-adapter, os: ubuntu-latest, python: '3.13'}
          - {lane: windows-ledger, os: windows-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONUTF8: '0'
      UV_PYTHON_DOWNLOADS: never
      CANDIDATE_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: CI verifier adversarial unit checks
        run: python -I -m unittest discover -s .github/ci -p "test_*.py" -v
      - name: Build, join installed origins, collect and execute exact inventory
        run: python -I .github/ci/exact_candidate.py
      - name: Retain candidate evidence (including failed attempts)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.lane }}-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/exact-live-candidate/evidence
          include-hidden-files: true # uv's generated wheels/.gitignore is in hashes.json
          if-no-files-found: error
          retention-days: 30