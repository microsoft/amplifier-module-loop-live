name: Test core and package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv venv .profile-venv
      - run: uv pip install --python .profile-venv/bin/python pytest pytest-asyncio 'amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@695f875c0908f45f8dc78b1fcde80ecddebffd7c'
      - run: .profile-venv/bin/python -m pytest -q tests/test_work_profile.py
      # Live acceptance is explicitly opt-in; CI never mounts user credentials.
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest -q
      - run: uv build
      - name: Check installed wheel without application adapters
        run: |
          uv venv "$RUNNER_TEMP/loop-live-smoke"
          uv pip install --python "$RUNNER_TEMP/loop-live-smoke/bin/python" dist/*.whl amplifier-core==1.6.1
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/loop-live-smoke/bin/python" -I -c 'from amplifier_module_loop_live import mount; from amplifier_module_loop_live.runtime import Runtime, Input; import sys; assert not any(name.startswith(("amplifier_app_cli", "amplifier_loop_live_cli", "amplifier_live", "amplifier_web")) for name in sys.modules)'
